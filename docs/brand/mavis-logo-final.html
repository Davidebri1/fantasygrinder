<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;background:#070b12;color:#f4f1e8;font-family:Barlow,system-ui;padding:24px;}
.row{display:flex;gap:28px;align-items:center;margin-bottom:28px;flex-wrap:wrap;}
.tile{width:280px;height:280px;border-radius:52px;}
.small{border-radius:12px;}
.lock{width:860px;height:234px;}
h3{font:600 13px/1 Barlow;letter-spacing:2px;color:#8b96a8;margin:0 0 10px;text-transform:uppercase;}
</style></head><body>
<h3>App tile</h3><div class="row"><img class="tile" src="mavis-outlier-logo-tile.svg"></div>
<h3>Mark on dark chrome</h3><div class="row"><img class="tile small" style="background:#0a0e16;border-radius:14px" src="mavis-outlier-logo-mark.svg"></div>
<h3>Favicon size check</h3><div class="row"><img class="small" style="width:64px;height:64px;border-radius:12px" src="mavis-outlier-logo-tile.svg"><img class="small" style="width:32px;height:32px;border-radius:6px" src="mavis-outlier-logo-tile.svg"></div>
<h3>Lockup</h3><div class="row"><img class="lock" src="mavis-outlier-logo-lockup.svg"></div>
</body></html>
