<!doctype html>
<html><head><meta charset="utf-8"><style>
  body { margin:0; background:#12120f; font-family: system-ui, sans-serif; color:#e8e4d8; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; padding:14px; }
  figure { margin:0; }
  img { width:100%; display:block; border-radius:10px; }
  figcaption { padding:7px 2px 0; font-size:13px; letter-spacing:.04em; color:#b9b3a2; }
</style></head>
<body><div class="grid">
  <figure><img src="mavis-logo-h1-turf.svg"><figcaption>H1 — chalk histogram on striped turf, one red bar apart</figcaption></figure>
  <figure><img src="mavis-logo-h2-field.svg"><figcaption>H2 — aerial field, distribution on the outfield grass</figcaption></figure>
  <figure><img src="mavis-logo-h3-outline.svg"><figcaption>H3 — chalk outline bars on the infield dirt</figcaption></figure>
  <figure><img src="mavis-logo-h4-night.svg"><figcaption>H4 — night turf, the red bar carrying its own light</figcaption></figure>
</div></body></html>
