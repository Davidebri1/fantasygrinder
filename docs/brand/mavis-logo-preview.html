<!doctype html><html><head><meta charset="utf-8"><style>
  body { margin:0; font-family: Barlow, Inter, 'Segoe UI', system-ui, sans-serif; }
  .sheet { display:grid; grid-template-columns: 1fr 1fr; width: 1100px; }
  .cell { display:flex; align-items:center; justify-content:center; padding: 40px; }
  .dark { background:#0a0e16; } .light { background:#f7f8fa; }
  svg { width: 340px; height: 340px; }
  .wide { grid-column: 1 / -1; }
  .lockup { width: 900px; height: 240px; }
</style></head><body><div class="sheet">
  <div class="cell dark"><img src="../brand/mavis-outlier-mark-dark.svg"></div>
  <div class="cell light"><img src="../brand/mavis-outlier-mark-light.svg"></div>
  <div class="cell dark wide"><img class="lockup" src="../brand/mavis-outlier-lockup.svg"></div>
</div></body></html>
