services:
  - type: web
    name: fantasy-grinder-api
    runtime: python
    plan: starter
    rootDir: backend/django
    buildCommand: |
      pip install -r requirements.txt &&
      python manage.py collectstatic --noinput
    startCommand: |
      python manage.py migrate &&
      python manage.py load_sample_data --no-input || true &&
      gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 4 --timeout 120
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fantasy_grinder_db
          property: connectionString
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_ALLOWED_HOSTS
        value: "fantasy-grinder-api.onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://fantasy-grinder.netlify.app,http://localhost:5173"
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: "4"

databases:
  - name: fantasy_grinder_db
    plan: starter
    databaseName: fantasy_grinder
    user: postgres
